<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    A play triangle over two subtitle lines. Flat fills, no gradients, drawn to
    survive 16px.

    Comments belong here rather than above the tag, and the header stays short:
    gdk-pixbuf only sniffs the first kilobyte for `<svg`. No em dashes either,
    since XML forbids a double hyphen in a comment.
  -->

  <!-- The tile, in the theme's accent. 22% radius reads as an app, not a document. -->
  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="#4d8df7"/>

  <!-- Nudged right of centre: a triangle's visual weight sits a third from its base. -->
  <path d="M206 132 L206 300 L352 216 Z" fill="#ffffff"/>

  <!-- Subtitle lines, centred as subtitles are on a frame. -->
  <rect x="136" y="350" width="240" height="34" rx="17" fill="#ffffff"/>
  <rect x="182" y="404" width="148" height="34" rx="17" fill="#ffffff" opacity="0.72"/>
</svg>
