# The build, for whoever is asking.
#
# This is called, never triggered. Two callers use it and they need the same
# builds: ci.yml on every push and pull request, release.yml once release-please
# has cut a tag. Keeping it in one file is the point -- a release that is built
# differently from the thing CI tested is a release nobody has tested, and two
# copies of a ninety-line job drift within a month of being written.
#
# The three targets docs/roadmap.md names are two jobs here:
#
# Linux builds against the from-source media stack (tools/build-deps.sh) and
# runs every headless suite. The prefix is cached on a hash of that script --
# its version pins live inside it -- because building it cold costs ~20 minutes
# and the cached prefix is 74 MB.
#
# Windows builds under MSYS2 UCRT64 exactly as docs/windows.md describes, but
# only while MSYS2 ships Qt >= 6.11: the CMake floor is deliberate and
# platform-split (CMakeLists.txt), so below it the job reports and stands down
# rather than failing every run. What it does below the floor depends on who is
# asking, and that is the one place the two callers differ -- see the gate.
#
# WSL has no job of its own and cannot have an honest one: it runs the same
# Linux ELF, and what makes it distinct -- WSLg's compositor and the Mesa D3D12
# driver (traps 1, 20, 22) -- needs a display a runner does not have. The Linux
# job's headless suites are the coverage CI can give it; the visual half stays
# manual (tools/render-canary.sh).
name: Build

on:
  workflow_call:
    inputs:
      package:
        description: >-
          Build the three downloads -- AppImage, portable zip, installer -- and
          upload them as workflow artifacts. Off for ordinary pushes and pull
          requests, because compressing ~300 MB on every commit is waste.
        type: boolean
        default: false
      release_tag:
        description: >-
          A tag to attach the packages to, as GitHub Release assets. Empty for
          everything that is not a release. Setting it also hardens the Windows
          Qt gate: see the note there.
        type: string
        default: ''
      ref:
        description: >-
          The commit, branch or tag to build. Empty means the caller's ref,
          which is what every automatic path wants. release.yml sets it when
          rebuilding an existing tag by hand, so the downloads come from the
          tree that tag names rather than from whatever master holds now.
        type: string
        default: ''

# Deliberately absent: a permissions block. A called workflow can narrow what
# the caller granted and cannot widen it, so declaring contents: write here
# would be rejected on the ci.yml path, which grants read. The callers set it --
# read from ci.yml, write from release.yml, which is the only one that uploads.

jobs:
  linux:
    name: Linux ${{ matrix.build_type }} (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    strategy:
      fail-fast: false
      matrix:
        # Debug only when testing. Packaging builds Release and nothing else --
        # a Debug leg on a release run compiles for four minutes and produces
        # no download, because every packaging step below is Release-gated.
        build_type: ${{ fromJSON(inputs.package && '["Release"]' || '["Debug","Release"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # The apt line from docs/building.md, verbatim, plus what CI itself
      # needs: a distribution ffmpeg for testdata/make-fixtures.sh (any ffmpeg
      # with libx264 -- the fixtures deliberately do not require the
      # from-source stack).
      #
      # The second group is the one that keeps breaking, and none of it is
      # needed to build or to test. Qt's xcb platform plugin loads these at run
      # time; linuxdeploy walks that plugin's ldd tree to bundle it, and the
      # runner image carries almost none of them. So the build passes, the ten
      # suites pass, and the AppImage step dies on a library nothing else in the
      # job wanted -- which happened twice, one library at a time, because each
      # missing one hides the next.
      #
      # Installing the whole xcb runtime set at once ends that. It is what the
      # Qt documentation lists for the xcb plugin, not a list grown from
      # failures.
      - name: Install system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git curl \
            ccache nasm g++-14 \
            glslang-dev glslang-tools libshaderc-dev spirv-tools liblcms2-dev libunwind-dev \
            libdav1d-dev libxml2-dev libzimg-dev libass-dev libvulkan-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev \
            libxrandr-dev libxpresent-dev libxss-dev libxinerama-dev \
            libegl1-mesa-dev libgl-dev libgbm-dev \
            libwayland-dev wayland-protocols \
            patchelf file desktop-file-utils \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-util1 \
            ffmpeg

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ~/data/Qt
          key: qt-6.12.0-linux-gcc64-shadertools-imageformats

      # qtdeclarative is not a valid module name here -- Quick, QML, Controls
      # and Svg ship inside the base desktop package (docs/building.md).
      - name: Install Qt 6.12.0
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pipx install aqtinstall
          aqt install-qt linux desktop 6.12.0 linux_gcc_64 \
            -m qtshadertools qtimageformats -O "$HOME/data/Qt"

      - name: Cache the media stack
        id: cache-stack
        uses: actions/cache@v4
        with:
          path: ~/data/subixa-stack
          key: subixa-stack-ubuntu-24.04-${{ hashFiles('tools/build-deps.sh') }}

      # Qt and the media stack were already cached and restore in about five
      # seconds between them. What was never cached is the part that actually
      # costs: compiling Subixa itself ran just under four minutes of a
      # four-and-a-half minute job, on every job, every time.
      #
      # The key carries the SHA so each run saves a fresh entry, and the
      # restore-key prefix means a new commit starts from the previous one's
      # cache rather than from nothing. A branch that touches no C++ then
      # compiles almost nothing.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-linux-${{ matrix.build_type }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ matrix.build_type }}-

      # build-deps.sh has no self-skip and meson wipes its build trees on every
      # run, so it only runs on a cache miss. meson comes from pipx: Ubuntu
      # 24.04's python is externally managed and its apt meson is too old for
      # libplacebo.
      - name: Build libplacebo, FFmpeg and mpv from source
        if: steps.cache-stack.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pipx install meson
          ./tools/build-deps.sh "$HOME/data/subixa-stack"

      - name: Configure and build
        run: |
          export CMAKE_PREFIX_PATH="$HOME/data/Qt/6.12.0/gcc_64"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSUBIXA_DEPS_PREFIX="$HOME/data/subixa-stack"
          cmake --build build
          ccache --show-stats

      - name: Generate test fixtures
        run: ./testdata/make-fixtures.sh

      # No display, no Xvfb: per-test QT_QPA_PLATFORM is already set by CMake
      # (minimal for nine suites, offscreen for qmlpanel), and rendercanary
      # self-excludes as DISABLED. Xvfb is explicitly ruled out in
      # docs/testing.md -- it produces false failures, not coverage.
      - name: Run the test suites
        run: ctest --test-dir build --output-on-failure

      # The installed tree, not a package. The binary carries absolute install
      # rpaths to the runner's Qt and media stack, so it runs where it was built
      # and nowhere else -- this artifact documents what installs rather than
      # something relocatable. That is what the AppImage below is for, and it is
      # kept on every run because it costs a few MB and answers "what did
      # cmake --install actually put where" without a rebuild.
      - name: Stage the install tree
        if: matrix.build_type == 'Release'
        run: cmake --install build --prefix "$PWD/stage/usr"

      - name: Upload the Linux install tree
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: subixa-linux-x86_64-installtree
          path: stage/
          if-no-files-found: error

      # No FUSE package needed: make-appimage.sh sets APPIMAGE_EXTRACT_AND_RUN
      # so neither linuxdeploy nor the result mounts anything.
      - name: Build the AppImage
        if: inputs.package && matrix.build_type == 'Release'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ./tools/make-appimage.sh build dist

      # A checksum per file rather than one SHA256SUMS for the release, because
      # the two halves are built on different machines and never meet before
      # upload. Joining them would take a third job whose only work is to
      # concatenate two lines.
      - name: Checksum the AppImage
        if: inputs.package && matrix.build_type == 'Release'
        run: |
          cd dist
          for f in *.AppImage; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload the AppImage
        if: inputs.package && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: subixa-linux-x86_64-appimage
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error

      # --clobber so that re-running a failed release job replaces the assets it
      # managed to upload before it died, rather than failing on the first one
      # that already exists.
      - name: Attach the AppImage to the release
        if: inputs.package && matrix.build_type == 'Release' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/*.AppImage dist/*.AppImage.sha256 --clobber

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # update: true does the two-pass core update docs/windows.md requires.
      # qt6-tools is not in the docs' install line but owns windeployqt6, which
      # the deploy step needs; zip is not in it either and owns the portable
      # download, and the UCRT64 toolchain does not pull either of them in.
      #
      # setup-msys2 caches its own packages already -- cache: true is the
      # default -- so this step costs its ~1m45s to the pacman update rather
      # than to downloading, and there is nothing here to switch on.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg

      # The floor is platform-split (CMakeLists.txt): Linux requires 6.12,
      # Windows 6.11. MSYS2 supplies Qt *and* the media stack from one
      # repository, so a floor its qt6-base cannot meet does not make the
      # Windows build older, it makes it unconfigurable -- which is how a
      # bundle came to be staged from a build tree two days behind the tree.
      #
      # Below the floor the gate does two different things, and the difference
      # is the whole reason release_tag is an input. On CI it stands the build
      # half down with a notice, because a rolling repository that has not
      # caught up yet is not a regression in this tree. On a release it fails:
      # skipping there would publish a release carrying the Linux downloads
      # only, silently, under a green tick -- and the first anyone would learn
      # of it is a Windows user finding nothing to download.
      - name: Check MSYS2 Qt against the 6.11 floor
        id: qt-gate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          ver=$(pacman -Q mingw-w64-ucrt-x86_64-qt6-base | awk '{print $2}' | cut -d- -f1)
          echo "MSYS2 qt6-base is $ver"
          if [ "$(printf '%s\n' 6.11 "$ver" | sort -V | head -n1)" = "6.11" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$RELEASE_TAG" ]; then
            echo "::error title=Windows cannot be released::qt6-base is $ver, below the Windows Qt 6.11 floor. A release cannot ship Linux-only downloads without saying so, so this fails rather than skipping."
            exit 1
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Windows build waiting on MSYS2::qt6-base is $ver, below the Windows Qt 6.11 floor. The build half of this job is skipped until MSYS2 ships it."
          fi

      # Same reasoning as the Linux ccache above: the compile is the job.
      - name: Cache ccache
        if: steps.qt-gate.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-

      - name: Configure and build
        if: steps.qt-gate.outputs.ok == 'true'
        run: |
          cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-win
          ccache --show-stats

      - name: Generate test fixtures
        if: steps.qt-gate.outputs.ok == 'true'
        run: ./testdata/make-fixtures.sh

      - name: Run the test suites
        if: steps.qt-gate.outputs.ok == 'true'
        run: ctest --test-dir build-win --output-on-failure

      - name: Stage the deployable bundle
        if: steps.qt-gate.outputs.ok == 'true'
        run: ./tools/deploy-win.sh build-win dist/subixa-win64

      - name: Upload the Windows bundle
        if: steps.qt-gate.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: subixa-win64
          path: dist/subixa-win64/
          if-no-files-found: error

      # Inno Setup is normally preinstalled on the windows runners; installing
      # it when absent costs nothing when it is present and avoids the job
      # failing on an image change. This step is pwsh rather than the job's
      # msys2 shell because choco is a Windows tool.
      - name: Ensure Inno Setup
        if: inputs.package && steps.qt-gate.outputs.ok == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /? | Select-Object -First 1

      # Both downloads come off the one staged folder, and the zip runs first
      # because the installer writes its output into the same dist/ directory.
      - name: Build the portable zip and the installer
        if: inputs.package && steps.qt-gate.outputs.ok == 'true'
        run: |
          ./tools/make-portable-win.sh dist/subixa-win64 dist
          ./tools/make-installer-win.sh dist/subixa-win64 dist

      - name: Checksum the Windows downloads
        if: inputs.package && steps.qt-gate.outputs.ok == 'true'
        run: |
          cd dist
          for f in *-portable.zip *-setup.exe; do sha256sum "$f" > "$f.sha256"; done

      - name: Upload the Windows downloads
        if: inputs.package && steps.qt-gate.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: subixa-win64-downloads
          path: |
            dist/*-portable.zip
            dist/*-setup.exe
            dist/*.sha256
          if-no-files-found: error

      # pwsh rather than the job's msys2 shell, and not for the reason the Inno
      # Setup step is: gh is a Windows executable and setup-msys2 defaults to a
      # minimal PATH, which does not carry the runner's tools into the MSYS
      # environment. The step above stays in msys2 because sha256sum is the
      # other way round -- coreutils, present there and absent here.
      - name: Attach the Windows downloads to the release
        if: inputs.package && steps.qt-gate.outputs.ok == 'true' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $files = Get-ChildItem -Path dist -File |
                   Where-Object { $_.Name -match '(-portable\.zip|-setup\.exe)(\.sha256)?$' }
          if (-not $files) { throw "nothing to upload: dist/ has no portable zip or installer" }
          gh release upload $env:RELEASE_TAG @($files | ForEach-Object { $_.FullName }) --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed" }
