# What runs on the way in: every push to a feature branch, every pull request,
# and master.
#
# The builds themselves are in build.yml, which release.yml also calls -- see
# the note at the top of that file for why they are not written twice. What
# lives here is the trigger, and the checks that only make sense before a change
# lands: the freedesktop metadata, and the commit messages that the release
# machinery reads to decide the next version number.
#
# Packaging is deliberately not on this path. The downloads are built when a
# release is cut, and on demand from the Actions tab -- compressing ~300 MB on
# every commit to answer a question nobody asked is waste, and the artifacts
# expire before anyone looks at them.
name: CI

# Branch pushes are deliberately not here. A branch with an open pull request
# used to match both triggers, so one commit ran the whole thing twice -- eight
# jobs for four jobs of work. The pull request is the one that matters, because
# it is the only one that can lint the commits, so that is the one kept. Push
# builds master, where there is no pull request to stand in for it.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master, 'feature/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Metadata and commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history: commitlint below reads the range of commits the pull
      # request adds, and a shallow clone does not contain their parents.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - name: Validate freedesktop metadata
        # --no-net: the screenshot URLs point at master, which only gains the
        # images when a release merges it, so they 404 until then
        # (docs/releasing.md). The metainfo itself carries no comments, because
        # it is installed verbatim into /usr/share/metainfo and ships in every
        # package.
        run: |
          desktop-file-validate com.akashjose.Subixa.desktop
          appstreamcli validate --no-net com.akashjose.Subixa.metainfo.xml

      # Conventional commits are load-bearing here rather than decoration: they
      # are the only input release-please has for choosing the next version, so
      # a commit with no prefix is not a style lapse, it is a change that
      # silently does not appear in any release. Both halves are checked
      # because either can be the one that reaches master -- the commits on a
      # merge, the title on a squash -- and which of the two it will be is not
      # known when the pull request opens. docs/releasing.md has the types.
      - name: Lint the commits
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6

      - name: Lint the pull request title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # The same rule as the commits: the types come from the shared
          # .commitlintrc.yml, and the subject is left alone so a title can
          # keep the sentence shape the rest of the tree writes in.
          validateSingleCommit: false
          subjectPattern: .+

  # Three build jobs cost about fifteen runner-minutes between them, and a
  # change to a .md file cannot affect any of it. This one job decides whether
  # they are worth starting.
  #
  # The filter is written as "everything, except" rather than as a list of code
  # paths, so a new directory is built by default. The failure mode of the
  # opposite spelling is a change nobody compiled.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Without this the exclusions below do nothing. The default
          # quantifier is 'some', which includes a file that matches *any*
          # pattern -- and '**' matches every file, so the filter always said
          # true and the three build jobs always ran.
          #
          # 'every' is the one that reads as an AND: a file counts only when it
          # matches '**' and also fails to match each negated pattern.
          #
          # v4 also has 'some-with-excludes', and reading for that value is how
          # this first went wrong: the action's README documents v4 while this
          # was pinned to v3, which takes 'every' or 'some' and nothing else.
          # 'every' says the same thing and is valid in both.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'

  build:
    name: Build
    needs: changes
    # Only a filter that ran and said "no code changed" may stop a build.
    #
    # This was written as `== 'true'` and it skipped every build the moment the
    # filter job failed -- an invalid input to the action, and three build jobs
    # silently did not run while the pull request looked merely red somewhere
    # else. An optimisation must not be able to turn testing off by breaking.
    #
    # always() because a failed dependency otherwise skips this job before the
    # condition is read at all. Then: dispatch always builds, an empty output
    # from a filter that crashed builds, and only a literal 'false' skips.
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.code != 'false'
      )
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      # On demand only. A maintainer who wants the three downloads without
      # cutting a release runs this workflow from the Actions tab; everything
      # else here is build and test.
      package: ${{ github.event_name == 'workflow_dispatch' }}
